<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">Wish Core 자료 관리 탭 구성 예시</title><desc id="desc">정리 기록, 과거 대화 재구축, 외부 AI 재구축과 JSON 가져오기 기능</desc>
<rect width="720" height="560" rx="22" fill="#f9faff"/><rect x="1" y="1" width="718" height="558" rx="21" fill="none" stroke="#d7dfef"/>
<g font-family="system-ui,sans-serif"><text x="28" y="43" font-size="21" font-weight="750" fill="#242c40">자료 관리</text>
<rect x="28" y="66" width="664" height="82" rx="15" fill="white" stroke="#d4deef"/><text x="50" y="100" font-size="16" font-weight="700" fill="#2d3548">정리 전후 비교</text><text x="50" y="126" font-size="12" fill="#77849e">방마다 최근 10회 · 추가 API 호출 없음</text>
<rect x="568" y="84" width="102" height="40" rx="10" fill="white" stroke="#ccd7e9"/><text x="619" y="109" text-anchor="middle" font-size="13" fill="#4b5872">정리 기록</text>
<rect x="28" y="164" width="664" height="128" rx="15" fill="white" stroke="#d4deef"/><text x="50" y="198" font-size="16" font-weight="700" fill="#2d3548">과거 대화 전체 재구축</text>
<text x="50" y="226" font-size="13" fill="#71809a">확정 RP를 읽고 현재상태·날짜로그·서사 고리·인물·자료를 다시 구성함.</text><text x="50" y="254" font-size="12" fill="#8490a7">지침 제외 원문 약 200,000자 · AI 답변 끝에서 분할</text>
<rect x="565" y="190" width="105" height="42" rx="10" fill="white" stroke="#ccd7e9"/><text x="617" y="217" text-anchor="middle" font-size="13" fill="#4b5872">대화 읽기</text>
<rect x="28" y="308" width="664" height="210" rx="15" fill="white" stroke="#d4deef"/><text x="50" y="343" font-size="16" font-weight="700" fill="#2d3548">외부 AI로 재구축</text><text x="50" y="370" font-size="13" fill="#71809a">전체 대화를 읽고 선택한 영역을 다시 정리함.</text>
<rect x="300" y="390" width="142" height="42" rx="10" fill="white" stroke="#ccd7e9"/><text x="371" y="417" text-anchor="middle" font-size="13" fill="#495774">지침 + TXT 받기</text>
<rect x="454" y="390" width="126" height="42" rx="10" fill="white" stroke="#ccd7e9"/><text x="517" y="417" text-anchor="middle" font-size="13" fill="#495774">JSON 가져오기</text>
<rect x="590" y="390" width="80" height="42" rx="10" fill="white" stroke="#ccd7e9"/><text x="630" y="417" text-anchor="middle" font-size="13" fill="#495774">지침</text>
<line x1="50" y1="452" x2="670" y2="452" stroke="#dfe5ef"/><text x="50" y="483" font-size="16" font-weight="700" fill="#2d3548">외부 AI로 2차 재구축</text><text x="50" y="507" font-size="12" fill="#7b879f">현재 방 자료를 카드별 고밀도 기록체로 압축함.</text></g></svg>

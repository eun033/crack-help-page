<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Wish Core 기억 탭 구성 예시</title><desc id="desc">기타 OOC 탭의 기본 프리셋, 추가, 주입 버튼과 지침 카드 목록</desc>
<rect width="720" height="520" rx="22" fill="#f9faff"/><rect x="1" y="1" width="718" height="518" rx="21" fill="none" stroke="#d7dfef"/>
<g font-family="system-ui,sans-serif"><text x="28" y="44" font-size="21" font-weight="750" fill="#242c40">기억</text>
<rect x="454" y="19" width="116" height="42" rx="10" fill="white" stroke="#cdd8eb"/><text x="512" y="45" text-anchor="middle" font-size="13" fill="#52617e">자동 정리 설정</text>
<rect x="580" y="19" width="112" height="42" rx="10" fill="#445db8"/><text x="636" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="white">기억 묶음 정리</text>
<text x="58" y="100" font-size="13" fill="#79849c">현재상태</text><text x="178" y="100" font-size="13" fill="#79849c">날짜로그</text><text x="296" y="100" font-size="13" fill="#79849c">서사 고리</text><text x="413" y="100" font-size="13" fill="#79849c">연표</text>
<rect x="526" y="72" width="166" height="44" rx="11" fill="#f1f3fa"/><text x="609" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#28334d">기타·OOC</text><line x1="28" y1="126" x2="692" y2="126" stroke="#dfe5f0"/>
<text x="30" y="159" font-size="13" fill="#77849e">OOC·문체·진행 규칙 4개</text>

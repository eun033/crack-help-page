<rect x="594" y="137" width="98" height="40" rx="20" fill="#e9edfb" stroke="#cad5f1"/><text x="643" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#4155a6">● 주입</text>
<rect x="28" y="194" width="664" height="66" rx="13" fill="white" stroke="#d4deef"/><text x="48" y="222" font-size="15" font-weight="700" fill="#30384a">최우선 규칙</text><text x="48" y="244" font-size="12" fill="#8490a8">4,776자</text>
